# Mantiene al día las acciones fijadas por SHA, la imagen base y las imágenes de compose.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    ignore:
      # Un salto mayor de Debian cambia los repos externos (PGDG, Microsoft) y nombres de paquetes: se hace a
      # propósito, con build completo, como en odd/tasks/debian-13-migration.md. Los parches de la versión actual siguen llegando.
      - dependency-name: debian
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
  # Landing (Astro): un solo PR semanal con los parches/menores; las actualizaciones de seguridad llegan aparte
  - package-ecosystem: npm
    directory: /landing
    schedule:
      interval: weekly
    commit-message:
      prefix: fix(deps)
    groups:
      landing:
        update-types: [minor, patch]
