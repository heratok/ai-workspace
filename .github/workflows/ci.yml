# Verifica cada push/PR ANTES de que los servidores hagan "./setup.sh upgrade":
# sintaxis de scripts, compose válido y que la imagen construya de verdad.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Cada lunes: reconstruye y escanea aunque nadie haga push (aparecen CVE nuevas sin cambios de código)
    - cron: '0 6 * * 1'

permissions:
  contents: read

# Dos push seguidos a la misma rama: el segundo cancela al primero (el build completo dura hasta 60 min)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - name: Sintaxis bash
        timeout-minutes: 5
        run: |
          for f in install.sh setup.sh aiws entrypoint.sh config/devdb config/ws-doctor config/extra-root.sh config/seed-guide.sh config/fetch-script.sh migrations/*.sh lib/*.sh scripts/*.sh tests/*.sh; do
            bash -n "$f" && echo "ok $f"
          done
          sh -n config/env.sh
      - name: ShellCheck (nivel warning, siguiendo los módulos de lib/)
        timeout-minutes: 10
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d -x --source-path=SCRIPTDIR -S warning install.sh setup.sh aiws entrypoint.sh config/devdb config/ws-doctor config/extra-root.sh config/seed-guide.sh config/fetch-script.sh migrations/*.sh scripts/*.sh tests/*.test.sh tests/run-all.sh tests/helpers/*.sh
          # Los módulos de lib/ comparten variables con setup.sh (colores, datos de la instancia): SC2034/SC2154 no aplican
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d -x --source-path=SCRIPTDIR -S warning -e SC2034,SC2154 lib/*.sh
      - name: Pruebas de multi-instancia
        timeout-minutes: 5
        run: bash tests/instances.test.sh
      - name: Pruebas del comando aiws
        timeout-minutes: 5
        run: bash tests/aiws.test.sh
      - name: Pruebas de la guía para agentes
        timeout-minutes: 5
        run: bash tests/guide.test.sh
      - name: Pruebas de restauración de respaldos
        timeout-minutes: 5
        run: bash tests/restore.test.sh
      - name: Pruebas de la documentación (enlaces y estructura)
        timeout-minutes: 5
        run: bash tests/docs.test.sh
      - name: Pruebas de endurecimiento del compose
        timeout-minutes: 5
        run: bash tests/hardening.test.sh
      - name: Pruebas de la estructura de setup.sh (módulos en lib/)
        timeout-minutes: 5
        run: bash tests/modules.test.sh
      - name: Pruebas de las migraciones (no borran datos ni contenedores en uso)
        timeout-minutes: 5
        run: bash tests/migrations.test.sh
      - name: Pruebas de tools (buscar y aplicar versiones nuevas)
        timeout-minutes: 5
        run: bash tests/tools.test.sh
      - name: Pruebas de update-pins (listar y fijar versiones)
        timeout-minutes: 5
        run: bash tests/update-pins.test.sh
      - name: Pruebas de versiones fijadas
        timeout-minutes: 5
        run: bash tests/pins.test.sh
      - name: Pruebas de la descarga de instaladores
        timeout-minutes: 5
        run: bash tests/fetch-script.test.sh
      - name: Pruebas del bloqueo por instancia (un comando que modifica a la vez)
        timeout-minutes: 5
        run: bash tests/lock.test.sh
      - name: Pruebas de clean, rollback y uninstall --all
        timeout-minutes: 5
        run: bash tests/maintenance.test.sh
      - name: Pruebas de add-key y components
        timeout-minutes: 5
        run: bash tests/commands.test.sh
      - name: Pruebas del filtro de jobs por archivos cambiados
        timeout-minutes: 5
        run: bash tests/ci-changes.test.sh
      - name: docker compose config
        timeout-minutes: 5
        run: |
          cp env.example .env
          sed -i 's/external: true/external: false/' docker-compose.yml
          docker compose config -q
          # Instancia principal: nombres de siempre (sin migrar servidores existentes)
          docker compose config > default.out
          for n in 'name: ai-workspace' 'container_name: ai-workspace-ts' 'image: ai-workspace:latest' 'name: ai_home' 'name: ai_ts_state' 'name: ai_ssh_host_keys'; do
            grep -qxE "[[:space:]]*$n" default.out || { echo "FALTA en la instancia principal: $n"; exit 1; }
          done
          # Instancia con alias: todo deriva de AIWS_NAME / AIWS_VOL_PREFIX
          sed -i -E '/^(AIWS_INSTANCE|TS_HOSTNAME|COMPOSE_PROFILES)=/d' .env
          { echo AIWS_INSTANCE=foo; echo AIWS_NAME=ai-workspace-foo; echo AIWS_VOL_PREFIX=ai-workspace-foo; echo TS_HOSTNAME=ai-workspace-foo; echo COMPOSE_PROFILES=mssql; } >> .env
          docker compose config > alias.out
          for n in 'name: ai-workspace-foo' 'container_name: ai-workspace-foo' 'container_name: ai-workspace-foo-ts' 'container_name: ai-workspace-foo-mssql' \
                   'image: ai-workspace-foo:latest' 'name: ai-workspace-foo_home' 'name: ai-workspace-foo_workspace' 'name: ai-workspace-foo_ssh_host_keys' \
                   'name: ai-workspace-foo_ts_state' 'name: ai-workspace-foo_mssql_data' 'hostname: ai-workspace-foo'; do
            grep -qxE "[[:space:]]*$n" alias.out || { echo "FALTA en la instancia foo: $n"; exit 1; }
          done
          ! grep -qE '(name|container_name): ai_|name: ai-workspace$|ai-workspace-ts$' alias.out || { echo "La instancia foo comparte nombres con la principal"; exit 1; }
          # Recursos configurables por .env (SHM_SIZE, PIDS_LIMIT, MEM_LIMIT, CPUS) con los mismos valores por defecto de siempre
          grep -qE 'shm_size: .?2gb|shm_size: "?2147483648"?' default.out || { echo "shm_size por defecto cambió"; exit 1; }
          grep -qE 'pids_limit: 2048' default.out || { echo "pids_limit por defecto cambió"; exit 1; }
          { echo SHM_SIZE=1g; echo PIDS_LIMIT=4096; echo MEM_LIMIT=3g; echo CPUS=2; } >> .env
          docker compose config > res.out
          grep -qE 'pids_limit: 4096' res.out || { echo "PIDS_LIMIT no se aplica"; exit 1; }
          grep -qE 'shm_size: .?(1g|1073741824)' res.out || { echo "SHM_SIZE no se aplica"; exit 1; }
          # Versiones elegidas con ./setup.sh tools (se guardan en el .env): deben llegar al build y a la imagen de Tailscale
          { echo CLAUDE_CODE_VERSION=2.1.290; echo HERDR_VERSION=0.9.3; echo TS_IMAGE_TAG=v1.100.0; } >> .env
          docker compose config > pins.out
          grep -qE 'CLAUDE_CODE_VERSION: 2\.1\.290' pins.out || { echo "CLAUDE_CODE_VERSION del .env no llega al build"; exit 1; }
          grep -qE 'HERDR_VERSION: 0\.9\.3' pins.out || { echo "HERDR_VERSION del .env no llega al build"; exit 1; }
          grep -qE 'image: tailscale/tailscale:v1\.100\.0' pins.out || { echo "TS_IMAGE_TAG del .env no llega a la imagen de Tailscale"; exit 1; }

  # Escaneo de seguridad del repo. Herramientas como contenedores FIJADOS por versión y digest (un tag se puede
  # mover; Dependabot no ve las imágenes dentro de "run:": súbelas a mano, tag y digest juntos).
  # Excepciones documentadas en .hadolint.yaml y .trivyignore.
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - name: Hadolint (Dockerfile; falla solo con errores)
        timeout-minutes: 5
        run: docker run --rm -i -v "$PWD/.hadolint.yaml:/cfg.yaml:ro" hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d hadolint --config /cfg.yaml --failure-threshold error - < Dockerfile
      - name: Trivy (secretos, dependencias y configuración; HIGH/CRITICAL con corrección)
        timeout-minutes: 10
        run: docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa fs --quiet --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /src/.trivyignore --exit-code 1 /src
      - name: Pruebas de la configuración de seguridad
        timeout-minutes: 5
        run: bash tests/security.test.sh

  # Decide qué jobs pesados hacen falta según los archivos cambiados (scripts/ci-changes.sh).
  # lint y security corren siempre; build y landing solo si el cambio los toca. El lunes, workflow_dispatch
  # o sin una base confiable para comparar, corre todo.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.diff.outputs.image }}
      landing: ${{ steps.diff.outputs.landing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          fetch-depth: 0
      - name: Archivos cambiados
        id: diff
        timeout-minutes: 5
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci-changes.sh "$EVENT" "$BASE" "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: [lint, changes]
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        timeout-minutes: 5
      - name: Construir imagen (con caché de capas; sin caché en la corrida del lunes)
        timeout-minutes: 45
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ai-workspace:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache: ${{ github.event_name == 'schedule' }}
      - name: Escanear la imagen (CRITICAL con corrección disponible; bloquea)
        timeout-minutes: 15
        # Baseline medido sobre la imagen completa: 0 CRITICAL con corrección.
        # El volumen trivy-cache guarda la base de vulnerabilidades y el análisis de capas: el segundo escaneo no los repite.
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache/trivy aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa image --quiet --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 ai-workspace:ci
      - name: Informe de CVE HIGH de la imagen (no bloquea)
        timeout-minutes: 15
        # El baseline son ~40 HIGH en binarios Go de terceros (gh, gentle-ai) que no se pueden corregir aquí.
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache/trivy aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa image --quiet --scanners vuln --severity HIGH --ignore-unfixed --exit-code 0 ai-workspace:ci
      - name: Entrypoint y sshd en un contenedor real (enlaces simbólicos del usuario y reenvíos)
        timeout-minutes: 15
        env:
          AIWS_TEST_IMAGE: ai-workspace:ci
          AIWS_TEST_REQUIRE: "1"
        run: bash tests/entrypoint.test.sh
      - name: Verificar herramientas dentro de la imagen
        timeout-minutes: 5
        run: |
          docker run --rm --entrypoint zsh ai-workspace:ci -lc '
            set -e
            for c in node npm pnpm git gh psql uv mise devdb ws-doctor claude pi playwright playwright-cli playwright-mcp herdr doppler gentle-ai agy; do
              command -v "$c" >/dev/null || { echo "FALTA: $c"; exit 1; }
              echo "ok $c"
            done'
      - name: Verificar la guía para agentes dentro de la imagen
        timeout-minutes: 5
        run: |
          docker run --rm --entrypoint bash ai-workspace:ci -c '
            set -e
            g=/etc/ai-workspace/AGENTS.md
            test -s "$g" || { echo "FALTA: $g"; exit 1; }
            grep -q "Componentes incluidos" "$g" || { echo "La guía no tiene la sección de componentes"; exit 1; }
            # cada comando citado en las tablas de la guía debe existir en la imagen
            for c in $(grep -E "^\|" "$g" | grep -oE "\`[^\`]+\`" | tr -d "\`" | awk "{print \$1}" | grep -E "^[a-z][a-z0-9-]*$" | sort -u); do
              command -v "$c" >/dev/null || { echo "FALTA (citado en la guía): $c"; exit 1; }
              echo "ok guía: $c"
            done
            ws-doctor --guide | grep -q "Guía del entorno"'

  # La landing (Astro) se despliega en Vercel: aquí se comprueba que compile y que sus dependencias
  # no tengan CVE HIGH/CRITICAL conocidas antes de llegar a main.
  landing:
    needs: changes
    if: needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - name: Instalar dependencias (exactas del lockfile)
        timeout-minutes: 10
        run: npm ci
      - name: Compilar la landing
        timeout-minutes: 10
        run: npm run build
      - name: Auditar dependencias (bloquea HIGH/CRITICAL)
        timeout-minutes: 5
        run: npm audit --audit-level=high
