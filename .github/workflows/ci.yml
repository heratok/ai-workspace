# Verifica cada push/PR ANTES de que los servidores hagan "./setup.sh upgrade":
# sintaxis de scripts, compose válido y que la imagen construya de verdad.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Cada lunes: reconstruye y escanea aunque nadie haga push (aparecen CVE nuevas sin cambios de código)
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sintaxis bash
        run: |
          for f in install.sh setup.sh aiws entrypoint.sh config/devdb config/ws-doctor config/extra-root.sh config/seed-guide.sh config/fetch-script.sh migrations/*.sh lib/*.sh scripts/*.sh tests/*.sh; do
            bash -n "$f" && echo "ok $f"
          done
          sh -n config/env.sh
      - name: ShellCheck (nivel warning, siguiendo los módulos de lib/)
        run: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 -x --source-path=SCRIPTDIR -S warning install.sh setup.sh aiws entrypoint.sh config/devdb config/ws-doctor config/extra-root.sh config/seed-guide.sh config/fetch-script.sh migrations/*.sh scripts/*.sh tests/*.test.sh tests/helpers/*.sh
      - name: Pruebas de multi-instancia
        run: bash tests/instances.test.sh
      - name: Pruebas del comando aiws
        run: bash tests/aiws.test.sh
      - name: Pruebas de la guía para agentes
        run: bash tests/guide.test.sh
      - name: Pruebas de restauración de respaldos
        run: bash tests/restore.test.sh
      - name: Pruebas de la documentación (enlaces y estructura)
        run: bash tests/docs.test.sh
      - name: Pruebas de endurecimiento del compose
        run: bash tests/hardening.test.sh
      - name: Pruebas de tools (buscar y aplicar versiones nuevas)
        run: bash tests/tools.test.sh
      - name: Pruebas de update-pins (listar y fijar versiones)
        run: bash tests/update-pins.test.sh
      - name: Pruebas de versiones fijadas
        run: bash tests/pins.test.sh
      - name: Pruebas de la descarga de instaladores
        run: bash tests/fetch-script.test.sh
      - name: docker compose config
        run: |
          cp env.example .env
          sed -i 's/external: true/external: false/' docker-compose.yml
          docker compose config -q
          # Instancia principal: nombres de siempre (sin migrar servidores existentes)
          docker compose config > default.out
          for n in 'name: ai-workspace' 'container_name: ai-workspace-ts' 'image: ai-workspace:latest' 'name: ai_home' 'name: ai_ts_state' 'name: ai_ssh_host_keys'; do
            grep -qxE "[[:space:]]*$n" default.out || { echo "FALTA en la instancia principal: $n"; exit 1; }
          done
          # Instancia con alias: todo deriva de AIWS_NAME / AIWS_VOL_PREFIX
          sed -i -E '/^(AIWS_INSTANCE|TS_HOSTNAME|COMPOSE_PROFILES)=/d' .env
          { echo AIWS_INSTANCE=foo; echo AIWS_NAME=ai-workspace-foo; echo AIWS_VOL_PREFIX=ai-workspace-foo; echo TS_HOSTNAME=ai-workspace-foo; echo COMPOSE_PROFILES=mssql; } >> .env
          docker compose config > alias.out
          for n in 'name: ai-workspace-foo' 'container_name: ai-workspace-foo' 'container_name: ai-workspace-foo-ts' 'container_name: ai-workspace-foo-mssql' \
                   'image: ai-workspace-foo:latest' 'name: ai-workspace-foo_home' 'name: ai-workspace-foo_workspace' 'name: ai-workspace-foo_ssh_host_keys' \
                   'name: ai-workspace-foo_ts_state' 'name: ai-workspace-foo_mssql_data' 'hostname: ai-workspace-foo'; do
            grep -qxE "[[:space:]]*$n" alias.out || { echo "FALTA en la instancia foo: $n"; exit 1; }
          done
          ! grep -qE '(name|container_name): ai_|name: ai-workspace$|ai-workspace-ts$' alias.out || { echo "La instancia foo comparte nombres con la principal"; exit 1; }
          # Recursos configurables por .env (SHM_SIZE, PIDS_LIMIT, MEM_LIMIT, CPUS) con los mismos valores por defecto de siempre
          grep -qE 'shm_size: .?2gb|shm_size: "?2147483648"?' default.out || { echo "shm_size por defecto cambió"; exit 1; }
          grep -qE 'pids_limit: 2048' default.out || { echo "pids_limit por defecto cambió"; exit 1; }
          { echo SHM_SIZE=1g; echo PIDS_LIMIT=4096; echo MEM_LIMIT=3g; echo CPUS=2; } >> .env
          docker compose config > res.out
          grep -qE 'pids_limit: 4096' res.out || { echo "PIDS_LIMIT no se aplica"; exit 1; }
          grep -qE 'shm_size: .?(1g|1073741824)' res.out || { echo "SHM_SIZE no se aplica"; exit 1; }
          # Versiones elegidas con ./setup.sh tools (se guardan en el .env): deben llegar al build y a la imagen de Tailscale
          { echo CLAUDE_CODE_VERSION=2.1.290; echo HERDR_VERSION=0.9.3; echo TS_IMAGE_TAG=v1.100.0; } >> .env
          docker compose config > pins.out
          grep -qE 'CLAUDE_CODE_VERSION: 2\.1\.290' pins.out || { echo "CLAUDE_CODE_VERSION del .env no llega al build"; exit 1; }
          grep -qE 'HERDR_VERSION: 0\.9\.3' pins.out || { echo "HERDR_VERSION del .env no llega al build"; exit 1; }
          grep -qE 'image: tailscale/tailscale:v1\.100\.0' pins.out || { echo "TS_IMAGE_TAG del .env no llega a la imagen de Tailscale"; exit 1; }

  # Escaneo de seguridad del repo. Herramientas como contenedores FIJADOS por versión (Dependabot no ve
  # las versiones dentro de "run:": súbelas a mano). Excepciones documentadas en .hadolint.yaml y .trivyignore.
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Hadolint (Dockerfile; falla solo con errores)
        run: docker run --rm -i -v "$PWD/.hadolint.yaml:/cfg.yaml:ro" hadolint/hadolint:v2.15.1 hadolint --config /cfg.yaml --failure-threshold error - < Dockerfile
      - name: Trivy (secretos, dependencias y configuración; HIGH/CRITICAL con corrección)
        run: docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.75.0 fs --quiet --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /src/.trivyignore --exit-code 1 /src
      - name: Pruebas de la configuración de seguridad
        run: bash tests/security.test.sh

  build:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construir imagen
        run: docker build --progress=plain -t ai-workspace:ci .
      - name: Escanear la imagen (CRITICAL con corrección disponible; bloquea)
        # Baseline medido sobre la imagen completa: 0 CRITICAL con corrección.
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.75.0 image --quiet --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 ai-workspace:ci
      - name: Informe de CVE HIGH de la imagen (no bloquea)
        # El baseline son ~40 HIGH en binarios Go de terceros (gh, gentle-ai) que no se pueden corregir aquí.
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.75.0 image --quiet --scanners vuln --severity HIGH --ignore-unfixed --exit-code 0 ai-workspace:ci
      - name: Verificar herramientas dentro de la imagen
        run: |
          docker run --rm --entrypoint zsh ai-workspace:ci -lc '
            set -e
            for c in node npm git gh psql uv mise devdb ws-doctor claude pi playwright playwright-cli playwright-mcp herdr doppler gentle-ai agy; do
              command -v "$c" >/dev/null || { echo "FALTA: $c"; exit 1; }
              echo "ok $c"
            done'
      - name: Verificar la guía para agentes dentro de la imagen
        run: |
          docker run --rm --entrypoint bash ai-workspace:ci -c '
            set -e
            g=/etc/ai-workspace/AGENTS.md
            test -s "$g" || { echo "FALTA: $g"; exit 1; }
            grep -q "Componentes incluidos" "$g" || { echo "La guía no tiene la sección de componentes"; exit 1; }
            # cada comando citado en las tablas de la guía debe existir en la imagen
            for c in $(grep -E "^\|" "$g" | grep -oE "\`[^\`]+\`" | tr -d "\`" | awk "{print \$1}" | grep -E "^[a-z][a-z0-9-]*$" | sort -u); do
              command -v "$c" >/dev/null || { echo "FALTA (citado en la guía): $c"; exit 1; }
              echo "ok guía: $c"
            done
            ws-doctor --guide | grep -q "Guía del entorno"'
