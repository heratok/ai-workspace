# Drop-in cargado por /etc/ssh/sshd_config (Include sshd_config.d/*.conf)
HostKey /etc/ssh/host_keys/ssh_host_ed25519_key

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
AllowUsers ai
MaxAuthTries 3
LoginGraceTime 30

X11Forwarding no
# Sin reenvío del agente: un proceso de "ai" (agente, paquete npm) podría firmar con las claves de tu PC.
AllowAgentForwarding no
# Solo "ssh -L" (login OAuth, ver docs/herramientas.md); sin -R, sockets ni túneles.
AllowTcpForwarding local
AllowStreamLocalForwarding no
PermitTunnel no
PermitUserEnvironment no
AcceptEnv LANG LC_* COLORTERM TERM_PROGRAM

ClientAliveInterval 60
ClientAliveCountMax 3
